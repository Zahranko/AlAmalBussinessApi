name: Build and Deploy to SmarterASP.NET

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AlAmalBusiness.sln

      - name: Build
        run: dotnet build AlAmalBusiness.sln -c Release --no-restore

      - name: Publish
        run: dotnet publish AlAmalBusiness.Api/AlAmalBusiness.Api.csproj -c Release --no-build -o ./publish

      # appsettings.json ships with the secret fields blank (see CLAUDE.md /
      # security notes) — the real connection string and JWT signing key live
      # only in GitHub Actions secrets and are stamped into the published
      # output here, never committed to the repo.
      - name: Inject production secrets into appsettings.json
        shell: pwsh
        run: |
          $path = "./publish/appsettings.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.ConnectionStrings.DefaultConnection = "${{ secrets.PROD_DB_CONNECTION_STRING }}"
          $config.JwtSettings.Key = "${{ secrets.PROD_JWT_KEY }}"
          $config | ConvertTo-Json -Depth 10 | Set-Content $path

      - name: Remove local dev config from publish output
        run: rm -f ./publish/appsettings.Development.json

      # IIS/ANCM keeps the running app's .dll files locked, which makes the
      # FTP overwrite fail with "550 The process cannot access the file
      # because it is being used by another process." Dropping app_offline.htm
      # tells ANCM to shut the app down and serve that file instead, releasing
      # the locks, so the real deploy step below can overwrite the dlls.
      - name: Prepare app_offline.htm
        run: |
          mkdir -p ./app-offline
          echo "<h1>Deploying, back shortly...</h1>" > ./app-offline/app_offline.htm

      - name: Take site offline
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./app-offline/
          server-dir: /AlAmalBusiness/

      - name: Wait for app pool to release file locks
        run: sleep 10

      - name: Deploy via FTP to SmarterASP.NET
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./publish/
          server-dir: /AlAmalBusiness/
          exclude: |
            **/.git*
            **/.git*/**

      - name: Bring site back online
        run: |
          curl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/AlAmalBusiness/" \
            -Q "DELE app_offline.htm"
