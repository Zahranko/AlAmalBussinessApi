name: Build and Deploy to VPS (Docker)

# Builds the API image (Dockerfile), pushes it to GitHub's container registry
# (private, ghcr.io/zahranko/alamalbussinessapi) and deploys that exact digest
# to the Hostinger VPS with a blue/green switch: the new container must answer
# /health/ready (database included) before nginx sends it any traffic; if it
# doesn't, the running version keeps serving and this job fails.
#
# Runs next to deploy.yml (SmarterASP) while both hosts are live; both use the
# same production secrets. Server side: D:\nginny\deploy\apps (nginny-deploy).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# never two deploys at once; a newer push waits for the running one
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zahranko/alamalbussinessapi
  VPS_HOST: 187.126.1.126
  # pinned VPS host key: the job refuses to talk to anything else
  VPS_HOST_KEY: "187.126.1.126 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJoeQxthadBslL2dG3FgwusrozZY89fb1BsJCcK5UMF7"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only prove the image builds; main pushes it.
      # The GitHub Actions cache keeps the NuGet-restore layer between runs,
      # so a code-only change skips the restore entirely.
      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # The deploy key can only run the forced command on the VPS
      # ("deploy <app> <image@digest>"): no shell, no forwarding.
      # The app's secrets and a short-lived registry token go over stdin;
      # nothing is written to the command line or the job log.
      - name: Deploy (blue/green) over SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB: ${{ secrets.PROD_DB_CONNECTION_STRING }}
          JWT: ${{ secrets.PROD_JWT_KEY }}
          PROXY: ${{ secrets.PROD_PROXY_SECRET }}
          SMTP_USER: ${{ secrets.PROD_SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.PROD_SMTP_PASSWORD }}
          WA_KEY: ${{ secrets.PROD_WHATSAPP_API_KEY }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_KEY" ] || { echo "::error::Secret VPS_DEPLOY_KEY is not set"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          {
            printf 'GHCR_USER=%s\n' "${{ github.actor }}"
            printf 'GHCR_TOKEN=%s\n' "$GHCR_TOKEN"
            printf 'ConnectionStrings__DefaultConnection=%s\n' "$DB"
            printf 'JwtSettings__Key=%s\n' "$JWT"
            printf 'ForwardedHeaders__ProxySecret=%s\n' "$PROXY"
            printf 'Email__Username=%s\n' "$SMTP_USER"
            printf 'Email__Password=%s\n' "$SMTP_PASS"
            printf 'Email__FromAddress=%s\n' "$SMTP_USER"
            printf 'WhatsApp__ApiKey=%s\n' "$WA_KEY"
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                deployer@"$VPS_HOST" "deploy alamal-api ${IMAGE}@${DIGEST}"

      - name: Check the public endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://businessapi.alamalhospitaljo.com/health/ready || true)
            echo "attempt $i: $code"; [ "$code" = 200 ] && exit 0; sleep 5
          done
          echo "::error::https://businessapi.alamalhospitaljo.com/health/ready is not 200"; exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
